<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat with Smile Dental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&display=swap">
<style>
:root{
  --bg:#F2F5F4; --surface:#FFFFFF; --sunk:#E8EEEC; --ink:#14201D; --muted:#5A6A65; --line:#D3DDD9;
  --accent:#0E7A6B; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA;
  --chatbg:#E5EBE9; --bubble-in:#FFFFFF; --bubble-out:#D3EEE6;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Noto Sans Bengali","Noto Sans Devanagari","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --sunk:#1D2824; --ink:#E4EDEA; --muted:#93A49F; --line:#2A3833;
  --accent:#3CC0A8; --accent-ink:#04211B; --accent-soft:#143A32;
  --chatbg:#111916; --bubble-in:#1C2723; --bubble-out:#164036; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --sunk:#1D2824; --ink:#E4EDEA; --muted:#93A49F; --line:#2A3833;
  --accent:#3CC0A8; --accent-ink:#04211B; --accent-soft:#143A32;
  --chatbg:#111916; --bubble-in:#1C2723; --bubble-out:#164036; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;display:flex;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chat{width:100%;max-width:480px;height:100%;max-height:820px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
@media (max-width:520px){body{padding:0}.chat{border-radius:0;border:0;max-height:none}}
.head{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--accent);color:var(--accent-ink)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-ink);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none}
.who{min-width:0;flex:1}
.who strong{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{opacity:.85;font-size:12.5px}
.newchat{border:1px solid currentColor;background:transparent;color:inherit;border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:600;cursor:pointer;opacity:.9}
.msgs{flex:1;overflow-y:auto;background:var(--chatbg);padding:14px 12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:84%;padding:8px 11px 6px;border-radius:12px;box-shadow:0 1px 0 rgba(0,0,0,.06);overflow-wrap:anywhere}
.msg.ai{background:var(--bubble-in);align-self:flex-start;border-top-left-radius:4px}
.msg.patient{background:var(--bubble-out);align-self:flex-end;border-top-right-radius:4px}
.msg .meta{display:block;text-align:right;font-size:10.5px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.typing{align-self:flex-start;background:var(--bubble-in);padding:10px 14px;border-radius:12px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3}30%{opacity:1}}
@media (prefers-reduced-motion:reduce){.typing i{animation:none}}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:var(--surface);border-top:1px solid var(--line);scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--sunk);border-radius:999px;padding:5px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--accent)}
.composer{display:flex;gap:8px;padding:10px;background:var(--surface);border-top:1px solid var(--line)}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:10px 14px}
.composer button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:0 18px;font-weight:700;cursor:pointer}
.composer button:disabled{opacity:.5;cursor:default}
.foot{font-size:11.5px;color:var(--muted);text-align:center;padding:0 10px 8px;background:var(--surface)}
.foot a{color:var(--muted)}
.err{align-self:center;font-size:12.5px;color:#B32143;background:rgba(179,33,67,.08);padding:4px 10px;border-radius:8px}
</style>
</head>
<body>
<main class="chat" aria-label="Chat with the clinic">
  <header class="head">
    <div class="avatar" aria-hidden="true" id="avatar">SD</div>
    <div class="who"><strong id="clinicTitle">Smile Dental Clinic</strong><small id="sub">AI assistant · replies instantly</small></div>
    <button class="newchat" id="newChat" type="button" title="Start a new conversation">New chat</button>
  </header>
  <div class="msgs" id="msgs" aria-live="polite"></div>
  <div class="chips" id="chips" aria-label="Example messages"></div>
  <form class="composer" id="composer">
    <input id="msgInput" autocomplete="off" maxlength="1000" placeholder="Type a message (English, বাংলা, हिन्दी)…" aria-label="Your message">
    <button id="sendBtn" type="submit">Send</button>
  </form>
  <div class="foot">You're chatting with an AI assistant. Type <b>human</b> to reach the front desk. · <a href="/login">Clinic login</a></div>
</main>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = s => esc(s).replace(/\*([^*\n]+)\*/g, "<strong>$1</strong>").replace(/\n/g, "<br>");
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
let sessionId = store.get("sd.chat"), messages = [], busy = false, error = "";

async function api(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(d.error || "Something went wrong"), { status: r.status });
  return d;
}
function render(typing) {
  const box = $("#msgs");
  box.innerHTML = messages.map(m => `<div class="msg ${m.kind}">${fmt(m.text)}<span class="meta">${esc(m.at)}${m.kind === "patient" ? " ✓✓" : ""}</span></div>`).join("")
    + (typing ? `<div class="typing" aria-label="Assistant is typing"><i></i><i></i><i></i></div>` : "")
    + (error ? `<div class="err">${esc(error)}</div>` : "");
  box.scrollTop = box.scrollHeight;
}
async function start(fresh) {
  try {
    const d = await api("/api/chat/start", { sessionId: fresh ? null : sessionId });
    sessionId = d.sessionId; store.set("sd.chat", sessionId);
    messages = d.messages; error = "";
    $("#clinicTitle").textContent = d.clinicName; document.title = "Chat with " + d.clinicName;
    $("#avatar").textContent = d.clinicName.split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join("").toUpperCase();
    $("#sub").textContent = d.isOpen ? "AI assistant · replies instantly" : "Clinic closed · AI assistant replies 24/7";
    $("#chips").innerHTML = d.chips.map((c, i) => `<button type="button" class="chip" data-i="${i}">${esc(c)}</button>`).join("");
    $("#chips").dataset.list = JSON.stringify(d.chips);
  } catch (e) { error = "Couldn't connect to the clinic. Please refresh the page."; }
  render();
}
async function send(text) {
  text = String(text || "").trim();
  if (!text || busy) return;
  busy = true; $("#sendBtn").disabled = true; error = "";
  messages.push({ kind: "patient", text, at: new Date().toTimeString().slice(0, 5) });
  render(true);
  try { messages.push(await api("/api/chat/send", { sessionId, text })); }
  catch (e) {
    if (e.status === 404) { error = "Your chat expired. Starting a new one…"; render(); await start(true); }
    else error = e.message || "Message not sent. Please try again.";
  }
  busy = false; $("#sendBtn").disabled = false; render(); $("#msgInput").focus();
}
$("#composer").addEventListener("submit", e => { e.preventDefault(); const v = $("#msgInput").value; $("#msgInput").value = ""; send(v); });
$("#chips").addEventListener("click", e => { const b = e.target.closest("[data-i]"); if (b) send(JSON.parse($("#chips").dataset.list)[b.dataset.i]); });
$("#newChat").addEventListener("click", () => { if (!busy) start(true); });
start(false);
})();
</script>
</body>
</html>
